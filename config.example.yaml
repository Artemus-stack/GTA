# Copy to config.yaml and adjust. Every key is optional; these are the defaults.
# Secrets (API keys) do NOT go here: put them in .env (see .env.example).

data_dir: data                       # SQLite queue, downloads, rendered clips

game:
  twitch_categories: ["Grand Theft Auto VI"]   # Twitch category names (looked up to IDs)
  youtube_query: "GTA 6"
  keywords: ["gta 6", "gta vi", "gta6", "gtavi", "grand theft auto vi", "grand theft auto 6"]

# Agent 1: watches the top live streams and detects chat explosions
scout:
  twitch_top_n: 100
  youtube_top_n: 100
  youtube_chat_readers: 100          # how many of those YouTube chats to read (one yt-dlp thread each)
  languages: []                      # e.g. ["en"]; empty = all
  refresh_twitch_s: 300
  refresh_youtube_s: 3600            # with YOUTUBE_API_KEY each refresh costs ~200 quota units
  spike_threshold_mpm: 500           # messages per minute that make a "moment"
  baseline_multiplier: 2.0           # ...and at least 2x the channel's normal rate (0 = off)
  baseline_window_s: 900
  warmup_s: 180                      # learn a channel's normal rate before flagging spikes
  cooldown_s: 120                    # one moment per burst
  max_spike_s: 180
  reaction_lag_s: 8                  # chat reacts ~8 s after the moment (stream delay + typing)
  chat_file_max_mb: 64
  streamers:
    blocklist: []                    # never clip these (Twitch logins / YouTube channel names or ids)
    allowlist: []                    # if set, ONLY clip these, e.g. streamers who welcome clippers

# Agent 2: cuts, captions and titles each moment
editor:
  pre_roll_s: 75                     # seconds downloaded before the chat spike...
  post_roll_s: 45                    # ...and after it
  max_height: 1080
  precise_cuts: true                 # frame-accurate downloads (re-encodes the cut points)
  whisper_model: small               # tiny | base | small | medium | large-v2 (large-v2 wants a GPU)
  device: null                       # null = auto (cuda when available)
  language: en                       # null = autodetect
  caption_font: "DejaVu Sans"        # any installed font, e.g. "Montserrat Black" or "Anton"
  fonts_dir: null                    # folder with extra .ttf files for captions
  credit_watermark: true             # small "twitch.tv/<streamer>" on the video
  facecams: {}                       # streamer -> [x, y, w, h] webcam box as fractions of the frame
  #   somestreamer: [0.72, 0.03, 0.26, 0.30]
  retry_delay_s: 600                 # wait between tries while a VOD isn't cuttable yet
  max_errors: 3
  max_moment_age_h: 30               # don't bother with moments older than this
  cookies_file: null                 # Netscape cookies.txt for yt-dlp (helps on datacenter IPs)

titles:
  enabled: true                      # false = template titles only
  model: claude-opus-5-5
  effort: medium                     # low | medium | high

# Agent 3: posts through Postiz, rotating accounts
publisher:
  postiz_url: https://api.postiz.com # self-hosted: http://localhost:4007/api (Postiz's docker-compose)
  platforms: [tiktok, youtube, instagram]
  include_accounts: []               # Postiz channel ids or names; empty = every connected account
  exclude_accounts: []
  min_gap_minutes: 90                # per account
  max_posts_per_day: 6               # per account
  max_schedule_ahead_h: 12           # skip a platform if every account is booked further out than this
  post_type: schedule                # "draft" = posts wait in Postiz for your approval
  tiktok_privacy: PUBLIC_TO_EVERYONE # SELF_ONLY until your TikTok app passes review
  tiktok_method: DIRECT_POST         # or UPLOAD (lands in the TikTok inbox as a draft)
  youtube_privacy: public
  hashtags: [gta6, gtavi, gta, gaming]
  credit_streamer: true
  posts_per_hour_limit: 80           # Postiz allows 90 POST /posts per hour by default (API_LIMIT)

# The learning loop
analyst:
  interval_s: 3600
  judge_after_h: 24                  # judge a post once it is this old
  hit_score: 0                       # 0 = a hit beats its platform's median viral score
  half_life_days: 10                 # older results count less, so trends can shift
  score_weights: {views: 1, likes: 1, comments: 3, shares: 10}
  arms: {}                           # restrict what gets tested, e.g.:
  #   layout: [blur, stack, crop]    #   (add "speaker" for ClipsAI's speaker tracking)
  #   captions: [pop, karaoke, clean]
  #   length: ["20", "30", "45", "58"]
  #   hook: [banner, none]

sheets:
  spreadsheet_id: ""                 # or GSHEET_ID in .env
  credentials_file: service-account.json
